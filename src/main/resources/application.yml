spring:
  application:
    name: record

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baseball_record}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP: 향후 통계/추천 알고리즘의 집계 쿼리가 많아질 것을 고려해
    # 커넥션 고갈이 발생하지 않도록 풀 사이즈와 타임아웃을 명시적으로 튜닝한다.
    hikari:
      pool-name: BaseballRecordHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      idle-timeout: 600000
      validation-timeout: 3000
      keepalive-time: 300000

  jpa:
    # OSIV(Open-Session-In-View) 비활성화.
    # 이 옵션을 켜두면(기본값 true) 컨트롤러/뷰 렌더링 시점까지 영속성 컨텍스트가 열려 있어
    # 트랜잭션 밖에서도 LAZY 프록시가 무분별하게 초기화될 수 있다(N+1이 뷰 레이어까지 전파됨).
    # false로 꺼서 반드시 서비스 계층의 트랜잭션 안에서만 연관관계를 조회하도록 강제한다.
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        # DB 컬럼명 스네이크 케이스 자동 매핑 (memberId -> member_id 등)
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # LAZY 연관관계를 목록 조회(예: 다이어리 목록 + 회원 정보)할 때 발생하는 N+1을
        # 개별 SELECT가 아닌 IN 절 배치 조회로 묶어 대용량 통계 조회 성능을 확보한다.
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

# 쿼리 실행 SQL 및 바인딩 파라미터 확인용 로깅.
# NOTE(중요): JPA 스펙상 @ManyToOne, @OneToOne의 기본 fetch 전략은 EAGER이다.
# yml 설정만으로 전역 기본값을 LAZY로 강제할 수는 없으므로,
# 반드시 모든 연관관계 어노테이션에 fetch = FetchType.LAZY를 명시적으로 선언할 것.
# (본 프로젝트의 Record.member 필드 참고)
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# JWT 발급/검증 설정.
# secret은 HS256 서명에 사용되므로 최소 32바이트(256bit) 이상이어야 하며,
# 운영 환경에서는 반드시 JWT_SECRET 환경변수로 override한다(DB_PASSWORD와 동일한 패턴).
jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-key-minimum-32-bytes-long}
  access-token-expire-ms: 1800000      # 30분
  refresh-token-expire-ms: 1209600000  # 14일
